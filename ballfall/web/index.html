<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Fall</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #12121a; color: #ccc; font-family: 'Courier New', monospace;
       display: flex; flex-direction: column; align-items: center; min-height: 100vh;
       padding: 16px; }
h1 { color: #fff; margin-bottom: 8px; font-size: 1.4rem; letter-spacing: .1em; }
#meta { display: flex; gap: 24px; margin-bottom: 12px; font-size: .9rem; }
#meta span { color: #888; }
#meta strong { color: #eee; }
#conn { font-size: .75rem; padding: 2px 8px; border-radius: 10px; background: #333;
        color: #888; margin-left: auto; align-self: center; }
#conn.ok { background: #1a3a1a; color: #6c6; }
#conn.err { background: #3a1a1a; color: #c66; }
canvas { cursor: crosshair; border: 2px solid #2a2a3a; border-radius: 4px; }
#role-badge { font-size: .75rem; padding: 2px 10px; border-radius: 10px;
              background: #1a2a3a; color: #6af; }
#role-badge.observer { background: #2a1a3a; color: #a6f; }
#msg { margin-top: 8px; font-size: .8rem; color: #888; min-height: 1.2em; }
</style>
</head>
<body>
<h1>Ball Fall</h1>
<div id="meta">
  <div>Score: <strong id="score">0</strong></div>
  <div>Status: <strong id="status">—</strong></div>
  <span id="role-badge">connecting…</span>
  <span id="conn">●&nbsp;connecting</span>
</div>
<canvas id="c"></canvas>
<div id="msg"></div>

<script>
const CELL = 60;
const PAD  = 5;
const COLORS = [null, '#dc3c3c', '#3cc850', '#3c78dc', '#e6c832'];
const DARKEN = [null, '#8a1a1a', '#1a6a20', '#1a3a8a', '#8a7010'];

let W = 8, H = 10;
let board    = [];
let matchSet = new Set();
let status   = 'connecting';
let role     = 'observer';
let cascade  = 0;

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = W * CELL;
  canvas.height = H * CELL;
}
resize();

// ── drawing ──────────────────────────────────────────────────────────────────

let flashOn = true;
setInterval(() => {
  if (status === 'clearing') {
    flashOn = !flashOn;
    draw();
  }
}, 200);

function draw() {
  ctx.fillStyle = '#16161e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const x = c * CELL, y = r * CELL;
      ctx.fillStyle = '#282838';
      ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);

      const clr = board[r] && board[r][c];
      if (!clr) continue;

      const isMatch = matchSet.has(`${r},${c}`);
      drawBall(x, y, isMatch ? null : clr, isMatch && flashOn);
    }
  }

  // selection highlight
  if (sel) {
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth   = 3;
    ctx.strokeRect(sel.c * CELL + 3, sel.r * CELL + 3, CELL - 6, CELL - 6);
  }
}

function drawBall(x, y, clr, white) {
  const cx = x + CELL / 2, cy = y + CELL / 2;
  const r  = CELL / 2 - PAD;

  // shadow
  ctx.beginPath();
  ctx.arc(cx + 2, cy + 3, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();

  // ball
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = white ? '#ffffff' : COLORS[clr];
  ctx.fill();

  if (!white) {
    // subtle edge shading
    const grad = ctx.createRadialGradient(cx - r * .3, cy - r * .3, r * .1, cx, cy, r);
    grad.addColorStop(0, 'rgba(255,255,255,.25)');
    grad.addColorStop(1, 'rgba(0,0,0,.2)');
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
}

// ── interaction ───────────────────────────────────────────────────────────────

let sel       = null;  // {r, c}
let dragStart = null;  // {x, y}

function cellAt(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    r: Math.floor((e.clientY - rect.top)  * scaleY / CELL),
    c: Math.floor((e.clientX - rect.left) * scaleX / CELL),
  };
}

canvas.addEventListener('mousedown', e => {
  if (role !== 'player' || status !== 'waiting') return;
  sel = cellAt(e);
  dragStart = { x: e.clientX, y: e.clientY };
  draw();
});

canvas.addEventListener('mouseup', e => {
  if (!sel || !dragStart) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  if (Math.abs(dx) < 8 && Math.abs(dy) < 8) {
    sel = null; dragStart = null; draw(); return; // too small — cancel
  }
  const dir = Math.abs(dx) > Math.abs(dy)
    ? (dx > 0 ? 'right' : 'left')
    : (dy > 0 ? 'down'  : 'up');
  sendMove(sel.r, sel.c, dir);
  sel = null; dragStart = null;
});

canvas.addEventListener('mouseleave', () => {
  sel = null; dragStart = null; draw();
});

// touch support
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (role !== 'player' || status !== 'waiting') return;
  const t = e.touches[0];
  sel = cellAt(t);
  dragStart = { x: t.clientX, y: t.clientY };
  draw();
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!sel || !dragStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - dragStart.x;
  const dy = t.clientY - dragStart.y;
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) { sel = null; dragStart = null; draw(); return; }
  const dir = Math.abs(dx) > Math.abs(dy)
    ? (dx > 0 ? 'right' : 'left')
    : (dy > 0 ? 'down'  : 'up');
  sendMove(sel.r, sel.c, dir);
  sel = null; dragStart = null;
}, { passive: false });

function sendMove(r, c, dir) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'move', row: r, col: c, dir }));
  }
}

// ── WebSocket ─────────────────────────────────────────────────────────────────

let ws;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    document.getElementById('conn').textContent = '● connected';
    document.getElementById('conn').className   = 'ok';
  };
  ws.onclose = () => {
    document.getElementById('conn').textContent = '● disconnected';
    document.getElementById('conn').className   = 'err';
    setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'welcome') {
      W = msg.width; H = msg.height; role = msg.role;
      resize();
      const badge = document.getElementById('role-badge');
      badge.textContent = role;
      badge.className   = role === 'observer' ? 'observer' : '';
      return;
    }

    if (msg.type === 'state') {
      board   = msg.board;
      status  = msg.status;
      cascade = msg.cascade || 0;
      matchSet = new Set((msg.matches || []).map(([r, c]) => `${r},${c}`));

      document.getElementById('score').textContent  = msg.score;
      document.getElementById('status').textContent = status;

      let info = '';
      if (status === 'invalid') info = 'Invalid move — no match created.';
      if (cascade > 0)          info = `Cascade ×${cascade + 1}!`;
      document.getElementById('msg').textContent = info;

      draw();
    }
  };
}

connect();
draw();
</script>
</body>
</html>
