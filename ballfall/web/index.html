<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Fall</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #12121a; color: #ccc; font-family: 'Courier New', monospace;
       display: flex; flex-direction: column; align-items: center; min-height: 100vh;
       padding: 16px; }
h1 { color: #fff; margin-bottom: 8px; font-size: 1.4rem; letter-spacing: .1em; }
#meta { display: flex; gap: 16px; margin-bottom: 12px; font-size: .9rem; align-items: center; flex-wrap: wrap; }
#meta span { color: #888; }
#meta strong { color: #eee; }
#conn { font-size: .75rem; padding: 2px 8px; border-radius: 10px; background: #333;
        color: #888; margin-left: auto; }
#conn.ok { background: #1a3a1a; color: #6c6; }
#conn.err { background: #3a1a1a; color: #c66; }

/* Mode toggle buttons */
.mode-btn { font-size: .8rem; padding: 3px 14px; border-radius: 10px;
            background: #28293a; color: #778; border: 1px solid #3a3b50;
            cursor: pointer; transition: background .15s; }
.mode-btn:hover { background: #32344a; }
.mode-btn.active { background: #1e4a9a; color: #cdf; border-color: #3a6acf; }

canvas { cursor: crosshair; border: 2px solid #2a2a3a; border-radius: 4px;
         display: block; position: relative; }
#canvas-wrap { position: relative; }
#role-badge { font-size: .75rem; padding: 2px 10px; border-radius: 10px;
              background: #1a2a3a; color: #6af; }
#role-badge.observer { background: #2a1a3a; color: #a6f; }
#claim-btn { font-size: .75rem; padding: 3px 12px; border-radius: 10px;
             background: #2a3a1a; color: #af6; border: 1px solid #4a6a2a;
             cursor: pointer; display: none; }
#claim-btn:hover { background: #3a5a1a; }
#msg { margin-top: 8px; font-size: .8rem; color: #888; min-height: 1.2em; }

/* Game-over overlay */
#gameover { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.75); border-radius: 2px;
            flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; cursor: pointer; }
#gameover.show { display: flex; }
#gameover h2 { color: #f88; font-size: 1.6rem; letter-spacing: .12em; }
#gameover .go-score { color: #eee; font-size: 1rem; }
#gameover .go-hint  { color: #888; font-size: .8rem; }
</style>
</head>
<body>
<h1>Ball Fall</h1>
<div id="meta">
  <div>Score: <strong id="score">0</strong></div>
  <div>Cascade: <strong id="cascade">—</strong></div>
  <span id="role-badge">connecting…</span>
  <button id="claim-btn" onclick="claimPlayer()">Take control</button>
  <button class="mode-btn" id="btn-demo"   onclick="setMode('demo')">Demo</button>
  <button class="mode-btn" id="btn-attack" onclick="setMode('attack')">Ball Attack</button>
  <span id="conn">●&nbsp;connecting</span>
</div>
<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="gameover" onclick="setMode('attack')">
    <h2>GAME OVER</h2>
    <div class="go-score" id="go-score">Score: 0</div>
    <div class="go-hint">Click to play again &nbsp;·&nbsp; choose a mode above to switch</div>
  </div>
</div>
<div id="msg"></div>

<script>
const CELL = 60;
const PAD  = 5;
const COLORS = [null, '#dc3c3c', '#3cc850', '#3c78dc', '#e6c832'];

let W = 8, H = 10;
let board    = [];
let bricks   = [];
let matchSet = new Set();
let score    = 0;
let cascade  = 0;
let gameStatus = 'waiting';
let role     = 'observer';
let gameMode = 'demo';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function setSize() {
  canvas.width  = W * CELL;
  canvas.height = H * CELL;
}
setSize();

// ── animation state ──────────────────────────────────────────────────────────

let swapAnim = null;
let fallAnim = null;
let flashOn  = true;
let flashInterval = null;

function startFlash() {
  if (flashInterval) return;
  flashInterval = setInterval(() => {
    flashOn = !flashOn;
    if (!swapAnim && !fallAnim) draw();
  }, 150);
}

function stopFlash() {
  if (flashInterval) { clearInterval(flashInterval); flashInterval = null; }
  flashOn = true;
}

let rafId = null;
function scheduleFrame() {
  if (!rafId) rafId = requestAnimationFrame(animFrame);
}

const FALL_GRAV  = 0.018;
const FALL_VMAX  = 0.45;
const SWAP_MS    = 420;

function animFrame() {
  rafId = null;
  const now = performance.now();
  let stillActive = false;

  if (swapAnim) {
    let t = (now - swapAnim.startTime) / swapAnim.duration;
    if (t >= 1) {
      if (swapAnim.phase === 'forward' && !swapAnim.valid) {
        swapAnim.phase = 'reverse';
        swapAnim.startTime = now;
      } else {
        swapAnim = null;
      }
    }
    if (swapAnim) stillActive = true;
  }

  if (fallAnim) {
    let allDone = true;
    for (const b of fallAnim.balls) {
      if (b.cur >= b.toRow) continue;
      allDone = false;
      b.vel = Math.min(b.vel + FALL_GRAV, FALL_VMAX);
      b.cur = Math.min(b.cur + b.vel, b.toRow);
    }
    if (allDone) {
      board   = fallAnim.board;
      score   = fallAnim.score;
      cascade = fallAnim.cascade;
      updateMeta();
      fallAnim = null;
    } else {
      stillActive = true;
    }
  }

  draw();
  if (stillActive) scheduleFrame();
}

// ── drawing ──────────────────────────────────────────────────────────────────

function smoothstep(t) { return t * t * (3 - 2 * t); }

function draw() {
  ctx.fillStyle = '#16161e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const suppress = new Set();
  if (swapAnim) {
    suppress.add(`${swapAnim.rowA},${swapAnim.colA}`);
    suppress.add(`${swapAnim.rowB},${swapAnim.colB}`);
  }
  if (fallAnim) {
    for (const b of fallAnim.balls) suppress.add(`${b.toRow},${b.col}`);
  }
  if (dragSel) suppress.add(`${dragSel.r},${dragSel.c}`);

  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const x = c * CELL, y = r * CELL;
      ctx.fillStyle = '#282838';
      ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);

      if (bricks[r] && bricks[r][c]) { drawBrick(x, y); continue; }
      if (suppress.has(`${r},${c}`)) continue;
      const clr = board[r] && board[r][c];
      if (!clr) continue;

      const isMatch = matchSet.has(`${r},${c}`);
      if (isMatch) {
        if (flashOn) drawBallFlash(x, y, clr);
        else         drawBall(x, y, clr, false);
      } else {
        drawBall(x, y, clr, false);
      }
    }
  }

  if (swapAnim) {
    const now = performance.now();
    let t = Math.min(Math.max((now - swapAnim.startTime) / swapAnim.duration, 0), 1);
    const ease = smoothstep(t);
    const progress = swapAnim.phase === 'reverse' ? 1 - ease : ease;
    const axPx = swapAnim.colA * CELL, ayPx = swapAnim.rowA * CELL;
    const bxPx = swapAnim.colB * CELL, byPx = swapAnim.rowB * CELL;
    if (swapAnim.colorA) drawBall(axPx + progress * (bxPx - axPx), ayPx + progress * (byPx - ayPx), swapAnim.colorA, false);
    if (swapAnim.colorB) drawBall(bxPx + progress * (axPx - bxPx), byPx + progress * (ayPx - byPx), swapAnim.colorB, false);
  }

  if (fallAnim) {
    for (const b of fallAnim.balls) drawBall(b.col * CELL, b.cur * CELL, b.color, false);
  }

  // Drag visual: ghost ring at origin, destination highlight, lifted ball at cursor
  if (dragSel && dragCurrent && role === 'player') {
    const clr = board[dragSel.r] && board[dragSel.r][dragSel.c];
    if (clr) {
      const ox  = dragSel.c * CELL + CELL / 2;
      const oy  = dragSel.r * CELL + CELL / 2;
      const ddx = dragCurrent.x - ox;
      const ddy = dragCurrent.y - oy;
      const adx = Math.abs(ddx), ady = Math.abs(ddy);

      // Ghost ring where the ball was lifted from
      ctx.beginPath();
      ctx.arc(ox, oy, CELL / 2 - PAD, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Destination cell highlight once direction is clear
      if (adx > CELL * 0.15 || ady > CELL * 0.15) {
        let dr = 0, dc = 0;
        if (adx >= ady) dc = ddx > 0 ? 1 : -1;
        else            dr = ddy > 0 ? 1 : -1;
        const tr = dragSel.r + dr, tc = dragSel.c + dc;
        if (tr >= 0 && tr < H && tc >= 0 && tc < W) {
          ctx.beginPath();
          ctx.arc(tc * CELL + CELL / 2, tr * CELL + CELL / 2, CELL / 2 - PAD + 5, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255,255,255,0.45)';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
      }

      // Lifted ball follows cursor, clamped so it reaches the adjacent cell's centre
      const maxOff = CELL;
      const ballX  = ox + Math.max(-maxOff, Math.min(maxOff, ddx)) - CELL / 2;
      const ballY  = oy + Math.max(-maxOff, Math.min(maxOff, ddy)) - CELL / 2;
      drawBallLifted(ballX, ballY, clr);
    }
  }
}

function drawBrick(x, y) {
  const p = 3, fp = 5;
  const half = (CELL - 2 * fp) / 2;
  ctx.fillStyle = '#5f4630';
  ctx.fillRect(x + p, y + p, CELL - 2 * p, CELL - 2 * p);
  ctx.fillStyle = '#785a3a';
  ctx.fillRect(x + fp, y + fp,          CELL - 2 * fp, half - 1);
  ctx.fillRect(x + fp, y + fp + half + 1, CELL - 2 * fp, half - 1);
  ctx.fillStyle = '#372616';
  ctx.fillRect(x + p, y + fp + half - 1, CELL - 2 * p, 2);  // horizontal mortar
  ctx.fillRect(x + CELL / 2 - 1, y + fp, 2, half - 1);       // top-half vertical
  ctx.fillRect(x + CELL / 4 - 1, y + fp + half + 1, 2, half - 1); // bottom-half left
  ctx.fillRect(x + 3 * CELL / 4 - 1, y + fp + half + 1, 2, half - 1); // bottom-half right
  ctx.fillStyle = 'rgba(255,200,140,0.18)';
  ctx.fillRect(x + fp, y + fp + 1, CELL - 2 * fp, 3);        // top highlight
}

function drawBall(x, y, clr, white) {
  const cx = x + CELL / 2, cy = y + CELL / 2;
  const r  = CELL / 2 - PAD;
  ctx.beginPath();
  ctx.arc(cx + 2, cy + 3, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = white ? '#ffffff' : COLORS[clr];
  ctx.fill();
  if (!white) {
    const grad = ctx.createRadialGradient(cx - r * .3, cy - r * .3, r * .1, cx, cy, r);
    grad.addColorStop(0, 'rgba(255,255,255,.25)');
    grad.addColorStop(1, 'rgba(0,0,0,.2)');
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
}

// Flash phase: original colour visible under a white overlay with outer glow ring.
function drawBallFlash(x, y, clr) {
  const cx = x + CELL / 2, cy = y + CELL / 2;
  const r  = CELL / 2 - PAD;
  ctx.beginPath();
  ctx.arc(cx, cy, r + 6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.43)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + 2, cy + 3, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = COLORS[clr];
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.60)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx - r * .35, cy - r * .35, r / 3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.82)';
  ctx.fill();
}

// Lifted ball drawn while dragging: larger shadow offset to imply elevation.
function drawBallLifted(x, y, clr) {
  const cx = x + CELL / 2, cy = y + CELL / 2;
  const r  = CELL / 2 - PAD;
  ctx.beginPath();
  ctx.arc(cx + 4, cy + 7, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = COLORS[clr];
  ctx.fill();
  const grad = ctx.createRadialGradient(cx - r * .3, cy - r * .3, r * .1, cx, cy, r);
  grad.addColorStop(0, 'rgba(255,255,255,.35)');
  grad.addColorStop(1, 'rgba(0,0,0,.18)');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
}

// ── interaction ───────────────────────────────────────────────────────────────

let dragSel     = null;
let dragStart   = null;
let dragCurrent = null; // canvas-space cursor position while dragging
let pendingMove = null; // {rowA,colA,rowB,colB} of the move just sent by drag

function pointerToCanvas(clientX, clientY) {
  const rect   = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

function cellAt(clientX, clientY) {
  const p = pointerToCanvas(clientX, clientY);
  return { r: Math.floor(p.y / CELL), c: Math.floor(p.x / CELL) };
}

// canMove allows dragging whenever the server can accept a queued move.
// 'gameover' is the only state where the server won't accept one.
// Falls and clears are fine: hub.MoveIn queues the move until stateWaiting.
function canMove() {
  return role === 'player' && gameStatus !== 'gameover';
}

canvas.addEventListener('mousedown', e => {
  if (!canMove()) return;
  dragSel     = cellAt(e.clientX, e.clientY);
  dragStart   = { x: e.clientX, y: e.clientY };
  dragCurrent = pointerToCanvas(e.clientX, e.clientY);
  draw();
});
canvas.addEventListener('mousemove', e => {
  if (!dragSel) return;
  dragCurrent = pointerToCanvas(e.clientX, e.clientY);
  draw();
});
canvas.addEventListener('mouseup', e => {
  if (!dragSel || !dragStart) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  const sel = dragSel;
  dragSel = null; dragStart = null; dragCurrent = null;
  draw();
  if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
  const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  dispatchMove(sel, dir);
});
canvas.addEventListener('mouseleave', () => {
  dragSel = null; dragStart = null; dragCurrent = null; draw();
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!canMove()) return;
  const t = e.touches[0];
  dragSel     = cellAt(t.clientX, t.clientY);
  dragStart   = { x: t.clientX, y: t.clientY };
  dragCurrent = pointerToCanvas(t.clientX, t.clientY);
  draw();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!dragSel) return;
  const t = e.touches[0];
  dragCurrent = pointerToCanvas(t.clientX, t.clientY);
  draw();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!dragSel || !dragStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - dragStart.x, dy = t.clientY - dragStart.y;
  const sel = dragSel;
  dragSel = null; dragStart = null; dragCurrent = null;
  draw();
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
  const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  dispatchMove(sel, dir);
}, { passive: false });
canvas.addEventListener('touchcancel', () => {
  dragSel = null; dragStart = null; dragCurrent = null; draw();
});

function sendMove(r, c, dir) {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: 'move', row: r, col: c, dir }));
}

// Record which move we are about to send so the swap_anim handler can skip
// the forward animation (the drag gesture already showed it).
function dispatchMove(sel, dir) {
  const off = {right:[0,1], left:[0,-1], down:[1,0], up:[-1,0]}[dir];
  if (off) pendingMove = { rowA: sel.r, colA: sel.c, rowB: sel.r+off[0], colB: sel.c+off[1] };
  sendMove(sel.r, sel.c, dir);
}

function claimPlayer() {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: 'claim' }));
}

function setMode(mode) {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: 'set_mode', mode }));
}

// ── meta UI ───────────────────────────────────────────────────────────────────

function updateMeta() {
  document.getElementById('score').textContent   = score;
  document.getElementById('cascade').textContent = cascade > 0 ? `×${cascade + 1}` : '—';
}

function setRole(r) {
  role = r;
  const badge = document.getElementById('role-badge');
  badge.textContent = r;
  badge.className   = r === 'observer' ? 'observer' : '';
  document.getElementById('claim-btn').style.display = r === 'observer' ? 'inline-block' : 'none';
}

function applyMode(m) {
  gameMode = m;
  document.getElementById('btn-demo').classList.toggle('active', m === 'demo');
  document.getElementById('btn-attack').classList.toggle('active', m === 'attack');
}

function showGameOver(finalScore) {
  document.getElementById('go-score').textContent = `Score: ${finalScore}`;
  document.getElementById('gameover').classList.add('show');
}

function hideGameOver() {
  document.getElementById('gameover').classList.remove('show');
}

// ── WebSocket ─────────────────────────────────────────────────────────────────

let ws;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    document.getElementById('conn').textContent = '● connected';
    document.getElementById('conn').className   = 'ok';
  };
  ws.onclose = () => {
    document.getElementById('conn').textContent = '● disconnected';
    document.getElementById('conn').className   = 'err';
    setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'welcome') {
      W = msg.width; H = msg.height;
      setSize();
      setRole(msg.role);
      if (msg.mode) applyMode(msg.mode);
      return;
    }

    if (msg.type === 'role') {
      setRole(msg.role);
      return;
    }

    if (msg.type === 'game_over') {
      gameStatus = 'gameover';
      stopFlash();
      swapAnim = null; fallAnim = null;
      dragSel = null; dragStart = null; // discard any in-flight drag
      score = msg.score;
      updateMeta();
      draw();
      showGameOver(msg.score);
      return;
    }

    if (msg.type === 'swap_anim') {
      hideGameOver();
      // Check if this confirms a move we just sent via drag.
      const pm = pendingMove;
      pendingMove = null;
      const isOwnDrag = pm &&
        pm.rowA === msg.rowA && pm.colA === msg.colA &&
        pm.rowB === msg.rowB && pm.colB === msg.colB;

      if (isOwnDrag && msg.valid) {
        // Drag already showed the forward motion; board state will follow via state/clearing.
        return;
      }
      swapAnim = {
        rowA: msg.rowA, colA: msg.colA,
        rowB: msg.rowB, colB: msg.colB,
        colorA: msg.colorA, colorB: msg.colorB,
        valid: msg.valid,
        // Own invalid drag: skip the forward trip (drag showed it), jump to snap-back.
        // Another player's move: play the full forward animation.
        phase: isOwnDrag ? 'reverse' : 'forward',
        startTime: performance.now(),
        duration: SWAP_MS,
      };
      scheduleFrame();
      return;
    }

    if (msg.type === 'fall_anim') {
      stopFlash();
      matchSet = new Set();
      gameStatus = 'falling';
      if (msg.bricks) bricks = msg.bricks;
      fallAnim = {
        board: msg.board, score: msg.score, cascade: msg.cascade,
        balls: msg.balls.map(b => ({
          color: b.color, col: b.col,
          fromRow: b.fromRow, toRow: b.toRow, cur: b.fromRow, vel: 0,
        })),
      };
      scheduleFrame();
      return;
    }

    if (msg.type === 'state') {
      if (msg.mode) applyMode(msg.mode);
      if (msg.status === 'waiting') hideGameOver();
      if (msg.bricks) bricks = msg.bricks;

      if (msg.status === 'clearing') {
        board    = msg.board;
        score    = msg.score;
        cascade  = msg.cascade || 0;
        matchSet = new Set((msg.matches || []).map(([r, c]) => `${r},${c}`));
        gameStatus = 'clearing';
        updateMeta();
        startFlash();
        if (!swapAnim && !fallAnim) draw();
      } else {
        stopFlash();
        matchSet  = new Set();
        board     = msg.board;
        score     = msg.score;
        cascade   = msg.cascade || 0;
        gameStatus = msg.status;
        updateMeta();
        document.getElementById('msg').textContent = msg.status === 'invalid' ? 'Invalid move — no match.' : '';
        if (!swapAnim && !fallAnim) draw();
      }
    }
  };
}

connect();
draw();
</script>
</body>
</html>
