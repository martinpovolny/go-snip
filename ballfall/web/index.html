<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Fall</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #12121a; color: #ccc; font-family: 'Courier New', monospace;
       display: flex; flex-direction: column; align-items: center; min-height: 100vh;
       padding: 16px; }
h1 { color: #fff; margin-bottom: 8px; font-size: 1.4rem; letter-spacing: .1em; }
#meta { display: flex; gap: 16px; margin-bottom: 12px; font-size: .9rem; align-items: center; flex-wrap: wrap; }
#meta span { color: #888; }
#meta strong { color: #eee; }
#conn { font-size: .75rem; padding: 2px 8px; border-radius: 10px; background: #333;
        color: #888; margin-left: auto; }
#conn.ok { background: #1a3a1a; color: #6c6; }
#conn.err { background: #3a1a1a; color: #c66; }

/* Mode toggle buttons */
.mode-btn { font-size: .8rem; padding: 3px 14px; border-radius: 10px;
            background: #28293a; color: #778; border: 1px solid #3a3b50;
            cursor: pointer; transition: background .15s; }
.mode-btn:hover { background: #32344a; }
.mode-btn.active { background: #1e4a9a; color: #cdf; border-color: #3a6acf; }

/* Solo layout */
#solo-wrap { position: relative; display: none; }
#solo-wrap.show { display: block; }
#solo-wrap canvas { cursor: crosshair; border: 2px solid #2a2a3a; border-radius: 4px; display: block; }

/* Versus layout */
#versus-wrap { display: none; gap: 8px; }
#versus-wrap.show { display: flex; }
.board-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.board-col canvas { cursor: crosshair; border: 2px solid #2a2a3a; border-radius: 4px; display: block; }
.board-label { font-size: .85rem; color: #aac; letter-spacing: .08em; }
.board-score { font-size: .85rem; color: #eee; }
.board-claim { font-size: .75rem; padding: 3px 12px; border-radius: 10px;
               background: #2a3a1a; color: #af6; border: 1px solid #4a6a2a;
               cursor: pointer; }
.board-claim:hover { background: #3a5a1a; }
.board-claim.hidden { visibility: hidden; }

#role-badge { font-size: .75rem; padding: 2px 10px; border-radius: 10px;
              background: #1a2a3a; color: #6af; }
#role-badge.observer { background: #2a1a3a; color: #a6f; }
#claim-btn { font-size: .75rem; padding: 3px 12px; border-radius: 10px;
             background: #2a3a1a; color: #af6; border: 1px solid #4a6a2a;
             cursor: pointer; display: none; }
#claim-btn:hover { background: #3a5a1a; }
#msg { margin-top: 8px; font-size: .8rem; color: #888; min-height: 1.2em; }

/* Game-over overlay */
.gameover-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.75); border-radius: 2px;
            flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; cursor: pointer; z-index: 10; }
.gameover-overlay.show { display: flex; }
.gameover-overlay h2 { font-size: 1.6rem; letter-spacing: .12em; }
.gameover-overlay h2.win  { color: #8f8; }
.gameover-overlay h2.lose { color: #f88; }
.gameover-overlay .go-score { color: #eee; font-size: 1rem; }
.gameover-overlay .go-hint  { color: #888; font-size: .8rem; }
</style>
</head>
<body>
<h1>Ball Fall</h1>
<div id="meta">
  <div id="score-wrap">Score: <strong id="score">0</strong></div>
  <div id="cascade-wrap">Cascade: <strong id="cascade">—</strong></div>
  <span id="role-badge">connecting…</span>
  <button id="claim-btn" onclick="claimPlayer()">Take control</button>
  <button class="mode-btn" id="btn-demo"   onclick="setMode('demo')">Demo</button>
  <button class="mode-btn" id="btn-attack" onclick="setMode('attack')">Ball Attack</button>
  <span id="conn">●&nbsp;connecting</span>
</div>

<!-- Solo layout -->
<div id="solo-wrap">
  <canvas id="c"></canvas>
  <div class="gameover-overlay" id="gameover" onclick="setMode('attack')">
    <h2 class="lose">GAME OVER</h2>
    <div class="go-score" id="go-score">Score: 0</div>
    <div class="go-hint">Click to play again &nbsp;·&nbsp; choose a mode above to switch</div>
  </div>
</div>

<!-- Versus layout -->
<div id="versus-wrap">
  <div class="board-col" id="board-col-1">
    <div class="board-label" id="board-label-1">Player 1</div>
    <div class="board-score">Score: <strong id="vscore1">0</strong></div>
    <div style="position:relative">
      <canvas id="vc1"></canvas>
      <div class="gameover-overlay" id="vgameover1">
        <h2 id="vgo-title1">DEFEATED</h2>
        <div class="go-score" id="vgo-score1">Score: 0</div>
      </div>
    </div>
    <button class="board-claim" id="vclaim1" onclick="claimVersus(1)">Play as P1</button>
  </div>
  <div class="board-col" id="board-col-2">
    <div class="board-label" id="board-label-2">Player 2</div>
    <div class="board-score">Score: <strong id="vscore2">0</strong></div>
    <div style="position:relative">
      <canvas id="vc2"></canvas>
      <div class="gameover-overlay" id="vgameover2">
        <h2 id="vgo-title2">DEFEATED</h2>
        <div class="go-score" id="vgo-score2">Score: 0</div>
      </div>
    </div>
    <button class="board-claim" id="vclaim2" onclick="claimVersus(2)">Play as P2</button>
  </div>
</div>

<div id="msg"></div>

<script>
const CELL = 60;
const PAD  = 5;
const COLORS = [null, '#dc3c3c', '#3cc850', '#3c78dc', '#e6c832'];

let W = 8, H = 10;
let gameMode = 'demo';
let myPlayerID = 0; // 1 or 2 in versus; 0 otherwise

// ── Solo state ─────────────────────────────────────────────────────────────
let board    = [];
let bricks   = [];
let matchSet = new Set();
let score    = 0;
let cascade  = 0;
let gameStatus = 'waiting';
let role     = 'observer';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// ── Versus state ────────────────────────────────────────────────────────────
const vBoards  = [null, { board:[], bricks:[], score:0, matchSet:new Set(), status:'waiting', swapAnim:null, fallAnim:null, flashOn:true, flashInterval:null },
                        { board:[], bricks:[], score:0, matchSet:new Set(), status:'waiting', swapAnim:null, fallAnim:null, flashOn:true, flashInterval:null }];
const vCanvas  = [null, document.getElementById('vc1'), document.getElementById('vc2')];
const vCtx     = [null, vCanvas[1].getContext('2d'), vCanvas[2].getContext('2d')];

let vDragSel     = [null, null, null]; // [_, p1drag, p2drag]
let vDragStart   = [null, null, null];
let vDragCurrent = [null, null, null];
let vPendingMove = [null, null, null];

function setSize() {
  canvas.width  = W * CELL;
  canvas.height = H * CELL;
  for (let p = 1; p <= 2; p++) {
    vCanvas[p].width  = W * CELL;
    vCanvas[p].height = H * CELL;
  }
}
setSize();

// ── Solo animation state ───────────────────────────────────────────────────
let swapAnim = null;
let fallAnim = null;
let flashOn  = true;
let flashInterval = null;

function startFlash() {
  if (flashInterval) return;
  flashInterval = setInterval(() => {
    flashOn = !flashOn;
    if (!swapAnim && !fallAnim) draw();
  }, 150);
}

function stopFlash() {
  if (flashInterval) { clearInterval(flashInterval); flashInterval = null; }
  flashOn = true;
}

let rafId = null;
function scheduleFrame() {
  if (!rafId) rafId = requestAnimationFrame(animFrame);
}

const FALL_GRAV = 0.018;
const FALL_VMAX = 0.45;
const SWAP_MS   = 420;

function animFrame() {
  rafId = null;
  const now = performance.now();
  let stillActive = false;

  if (swapAnim) {
    let t = (now - swapAnim.startTime) / swapAnim.duration;
    if (t >= 1) {
      if (swapAnim.phase === 'forward' && !swapAnim.valid) {
        swapAnim.phase = 'reverse';
        swapAnim.startTime = now;
      } else {
        swapAnim = null;
      }
    }
    if (swapAnim) stillActive = true;
  }

  if (fallAnim) {
    let allDone = true;
    for (const b of fallAnim.balls) {
      if (b.cur >= b.toRow) continue;
      allDone = false;
      b.vel = Math.min(b.vel + FALL_GRAV, FALL_VMAX);
      b.cur = Math.min(b.cur + b.vel, b.toRow);
    }
    if (allDone) {
      board   = fallAnim.board;
      score   = fallAnim.score;
      cascade = fallAnim.cascade;
      updateMeta();
      fallAnim = null;
    } else {
      stillActive = true;
    }
  }

  draw();
  if (stillActive) scheduleFrame();
}

// ── Versus animation helpers ────────────────────────────────────────────────
function vStartFlash(p) {
  const s = vBoards[p];
  if (s.flashInterval) return;
  s.flashInterval = setInterval(() => {
    s.flashOn = !s.flashOn;
    if (!s.swapAnim && !s.fallAnim) vDraw(p);
  }, 150);
}

function vStopFlash(p) {
  const s = vBoards[p];
  if (s.flashInterval) { clearInterval(s.flashInterval); s.flashInterval = null; }
  s.flashOn = true;
}

let vRafId = [null, null, null];
function vScheduleFrame(p) {
  if (!vRafId[p]) vRafId[p] = requestAnimationFrame(() => { vRafId[p] = null; vAnimFrame(p); });
}

function vAnimFrame(p) {
  const s    = vBoards[p];
  const now  = performance.now();
  let stillActive = false;

  if (s.swapAnim) {
    let t = (now - s.swapAnim.startTime) / s.swapAnim.duration;
    if (t >= 1) {
      if (s.swapAnim.phase === 'forward' && !s.swapAnim.valid) {
        s.swapAnim.phase = 'reverse';
        s.swapAnim.startTime = now;
      } else {
        s.swapAnim = null;
      }
    }
    if (s.swapAnim) stillActive = true;
  }

  if (s.fallAnim) {
    let allDone = true;
    for (const b of s.fallAnim.balls) {
      if (b.cur >= b.toRow) continue;
      allDone = false;
      b.vel = Math.min(b.vel + FALL_GRAV, FALL_VMAX);
      b.cur = Math.min(b.cur + b.vel, b.toRow);
    }
    if (allDone) {
      s.board   = s.fallAnim.board;
      s.score   = s.fallAnim.score;
      vBoards[p].score = s.score;
      document.getElementById(`vscore${p}`).textContent = s.score;
      s.fallAnim = null;
    } else {
      stillActive = true;
    }
  }

  vDraw(p);
  if (stillActive) vScheduleFrame(p);
}

// ── Solo drawing ───────────────────────────────────────────────────────────
function smoothstep(t) { return t * t * (3 - 2 * t); }

function draw() {
  ctx.fillStyle = '#16161e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawBoardOn(ctx, board, bricks, matchSet, flashOn, swapAnim, fallAnim, null, null);
}

// ── Generic board drawing ──────────────────────────────────────────────────
function drawBoardOn(c2d, brd, brk, mset, fOn, sAnim, fAnim, dragSel, dragCurrent) {
  const suppress = new Set();
  if (sAnim) {
    suppress.add(`${sAnim.rowA},${sAnim.colA}`);
    suppress.add(`${sAnim.rowB},${sAnim.colB}`);
  }
  if (fAnim) {
    for (const b of fAnim.balls) suppress.add(`${b.toRow},${b.col}`);
  }
  if (dragSel) suppress.add(`${dragSel.r},${dragSel.c}`);

  for (let r = 0; r < H; r++) {
    for (let cc = 0; cc < W; cc++) {
      const x = cc * CELL, y = r * CELL;
      c2d.fillStyle = '#282838';
      c2d.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);

      if (brk[r] && brk[r][cc]) { drawBrickOn(c2d, x, y); continue; }
      if (suppress.has(`${r},${cc}`)) continue;
      const clr = brd[r] && brd[r][cc];
      if (!clr) continue;

      const isMatch = mset.has(`${r},${cc}`);
      if (isMatch) {
        if (fOn) drawBallFlashOn(c2d, x, y, clr);
        else     drawBallOn(c2d, x, y, clr, false);
      } else {
        drawBallOn(c2d, x, y, clr, false);
      }
    }
  }

  if (sAnim) {
    const now = performance.now();
    let t = Math.min(Math.max((now - sAnim.startTime) / sAnim.duration, 0), 1);
    const ease = smoothstep(t);
    const progress = sAnim.phase === 'reverse' ? 1 - ease : ease;
    const axPx = sAnim.colA * CELL, ayPx = sAnim.rowA * CELL;
    const bxPx = sAnim.colB * CELL, byPx = sAnim.rowB * CELL;
    if (sAnim.colorA) drawBallOn(c2d, axPx + progress*(bxPx-axPx), ayPx + progress*(byPx-ayPx), sAnim.colorA, false);
    if (sAnim.colorB) drawBallOn(c2d, bxPx + progress*(axPx-bxPx), byPx + progress*(ayPx-byPx), sAnim.colorB, false);
  }

  if (fAnim) {
    for (const b of fAnim.balls) drawBallOn(c2d, b.col*CELL, b.cur*CELL, b.color, false);
  }

  if (dragSel && dragCurrent) {
    const clr = brd[dragSel.r] && brd[dragSel.r][dragSel.c];
    if (clr) {
      const ox  = dragSel.c * CELL + CELL / 2;
      const oy  = dragSel.r * CELL + CELL / 2;
      const ddx = dragCurrent.x - ox;
      const ddy = dragCurrent.y - oy;
      const adx = Math.abs(ddx), ady = Math.abs(ddy);

      c2d.beginPath();
      c2d.arc(ox, oy, CELL / 2 - PAD, 0, Math.PI * 2);
      c2d.strokeStyle = 'rgba(255,255,255,0.35)';
      c2d.lineWidth = 2;
      c2d.stroke();

      if (adx > CELL * 0.15 || ady > CELL * 0.15) {
        let dr = 0, dc = 0;
        if (adx >= ady) dc = ddx > 0 ? 1 : -1;
        else            dr = ddy > 0 ? 1 : -1;
        const tr = dragSel.r + dr, tc = dragSel.c + dc;
        if (tr >= 0 && tr < H && tc >= 0 && tc < W) {
          c2d.beginPath();
          c2d.arc(tc*CELL+CELL/2, tr*CELL+CELL/2, CELL/2-PAD+5, 0, Math.PI*2);
          c2d.strokeStyle = 'rgba(255,255,255,0.45)';
          c2d.lineWidth = 3;
          c2d.stroke();
        }
      }

      const maxOff = CELL;
      const ballX  = ox + Math.max(-maxOff, Math.min(maxOff, ddx)) - CELL / 2;
      const ballY  = oy + Math.max(-maxOff, Math.min(maxOff, ddy)) - CELL / 2;
      drawBallLiftedOn(c2d, ballX, ballY, clr);
    }
  }
}

function vDraw(p) {
  const s = vBoards[p];
  const c2d = vCtx[p];
  c2d.fillStyle = '#16161e';
  c2d.fillRect(0, 0, vCanvas[p].width, vCanvas[p].height);
  drawBoardOn(c2d, s.board, s.bricks, s.matchSet, s.flashOn, s.swapAnim, s.fallAnim,
    vDragSel[p], vDragCurrent[p]);
}

function drawBrickOn(c2d, x, y) {
  const p = 3, fp = 5;
  const half = (CELL - 2 * fp) / 2;
  c2d.fillStyle = '#5f4630';
  c2d.fillRect(x + p, y + p, CELL - 2 * p, CELL - 2 * p);
  c2d.fillStyle = '#785a3a';
  c2d.fillRect(x + fp, y + fp,            CELL - 2 * fp, half - 1);
  c2d.fillRect(x + fp, y + fp + half + 1, CELL - 2 * fp, half - 1);
  c2d.fillStyle = '#372616';
  c2d.fillRect(x + p, y + fp + half - 1, CELL - 2 * p, 2);
  c2d.fillRect(x + CELL / 2 - 1, y + fp, 2, half - 1);
  c2d.fillRect(x + CELL / 4 - 1, y + fp + half + 1, 2, half - 1);
  c2d.fillRect(x + 3 * CELL / 4 - 1, y + fp + half + 1, 2, half - 1);
  c2d.fillStyle = 'rgba(255,200,140,0.18)';
  c2d.fillRect(x + fp, y + fp + 1, CELL - 2 * fp, 3);
}

function drawBallOn(c2d, x, y, clr, white) {
  const cx = x + CELL / 2, cy = y + CELL / 2;
  const r  = CELL / 2 - PAD;
  c2d.beginPath(); c2d.arc(cx+2, cy+3, r, 0, Math.PI*2);
  c2d.fillStyle = 'rgba(0,0,0,0.35)'; c2d.fill();
  c2d.beginPath(); c2d.arc(cx, cy, r, 0, Math.PI*2);
  c2d.fillStyle = white ? '#ffffff' : COLORS[clr]; c2d.fill();
  if (!white) {
    const grad = c2d.createRadialGradient(cx-r*.3, cy-r*.3, r*.1, cx, cy, r);
    grad.addColorStop(0, 'rgba(255,255,255,.25)');
    grad.addColorStop(1, 'rgba(0,0,0,.2)');
    c2d.beginPath(); c2d.arc(cx, cy, r, 0, Math.PI*2);
    c2d.fillStyle = grad; c2d.fill();
  }
}

function drawBallFlashOn(c2d, x, y, clr) {
  const cx = x + CELL/2, cy = y + CELL/2, r = CELL/2 - PAD;
  c2d.beginPath(); c2d.arc(cx, cy, r+6, 0, Math.PI*2);
  c2d.fillStyle = 'rgba(255,255,255,0.43)'; c2d.fill();
  c2d.beginPath(); c2d.arc(cx+2, cy+3, r, 0, Math.PI*2);
  c2d.fillStyle = 'rgba(0,0,0,0.35)'; c2d.fill();
  c2d.beginPath(); c2d.arc(cx, cy, r, 0, Math.PI*2);
  c2d.fillStyle = COLORS[clr]; c2d.fill();
  c2d.beginPath(); c2d.arc(cx, cy, r, 0, Math.PI*2);
  c2d.fillStyle = 'rgba(255,255,255,0.60)'; c2d.fill();
  c2d.beginPath(); c2d.arc(cx-r*.35, cy-r*.35, r/3, 0, Math.PI*2);
  c2d.fillStyle = 'rgba(255,255,255,0.82)'; c2d.fill();
}

function drawBallLiftedOn(c2d, x, y, clr) {
  const cx = x + CELL/2, cy = y + CELL/2, r = CELL/2 - PAD;
  c2d.beginPath(); c2d.arc(cx+4, cy+7, r, 0, Math.PI*2);
  c2d.fillStyle = 'rgba(0,0,0,0.45)'; c2d.fill();
  c2d.beginPath(); c2d.arc(cx, cy, r, 0, Math.PI*2);
  c2d.fillStyle = COLORS[clr]; c2d.fill();
  const grad = c2d.createRadialGradient(cx-r*.3, cy-r*.3, r*.1, cx, cy, r);
  grad.addColorStop(0, 'rgba(255,255,255,.35)');
  grad.addColorStop(1, 'rgba(0,0,0,.18)');
  c2d.beginPath(); c2d.arc(cx, cy, r, 0, Math.PI*2);
  c2d.fillStyle = grad; c2d.fill();
}

// ── Solo interaction ───────────────────────────────────────────────────────
let dragSel     = null;
let dragStart   = null;
let dragCurrent = null;
let pendingMove = null;

function pointerToCanvas(clientX, clientY, cvs) {
  const rect   = cvs.getBoundingClientRect();
  const scaleX = cvs.width  / rect.width;
  const scaleY = cvs.height / rect.height;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

function cellAt(clientX, clientY, cvs) {
  const p = pointerToCanvas(clientX, clientY, cvs);
  return { r: Math.floor(p.y / CELL), c: Math.floor(p.x / CELL) };
}

function canMove() {
  return role === 'player' && gameStatus !== 'gameover';
}

canvas.addEventListener('mousedown', e => {
  if (!canMove()) return;
  dragSel     = cellAt(e.clientX, e.clientY, canvas);
  dragStart   = { x: e.clientX, y: e.clientY };
  dragCurrent = pointerToCanvas(e.clientX, e.clientY, canvas);
  draw();
});
canvas.addEventListener('mousemove', e => {
  if (!dragSel) return;
  dragCurrent = pointerToCanvas(e.clientX, e.clientY, canvas);
  draw();
});
canvas.addEventListener('mouseup', e => {
  if (!dragSel || !dragStart) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  const sel = dragSel;
  dragSel = null; dragStart = null; dragCurrent = null;
  draw();
  if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
  const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  dispatchMove(sel, dir);
});
canvas.addEventListener('mouseleave', () => {
  dragSel = null; dragStart = null; dragCurrent = null; draw();
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!canMove()) return;
  const t = e.touches[0];
  dragSel     = cellAt(t.clientX, t.clientY, canvas);
  dragStart   = { x: t.clientX, y: t.clientY };
  dragCurrent = pointerToCanvas(t.clientX, t.clientY, canvas);
  draw();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!dragSel) return;
  const t = e.touches[0];
  dragCurrent = pointerToCanvas(t.clientX, t.clientY, canvas);
  draw();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!dragSel || !dragStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - dragStart.x, dy = t.clientY - dragStart.y;
  const sel = dragSel;
  dragSel = null; dragStart = null; dragCurrent = null;
  draw();
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
  const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  dispatchMove(sel, dir);
}, { passive: false });
canvas.addEventListener('touchcancel', () => {
  dragSel = null; dragStart = null; dragCurrent = null; draw();
});

// ── Versus interaction ─────────────────────────────────────────────────────
function canMoveVersus(p) {
  return myPlayerID === p && vBoards[p].status !== 'gameover';
}

function attachVersusHandlers(p) {
  const cvs = vCanvas[p];
  cvs.addEventListener('mousedown', e => {
    if (!canMoveVersus(p)) return;
    vDragSel[p]     = cellAt(e.clientX, e.clientY, cvs);
    vDragStart[p]   = { x: e.clientX, y: e.clientY };
    vDragCurrent[p] = pointerToCanvas(e.clientX, e.clientY, cvs);
    vDraw(p);
  });
  cvs.addEventListener('mousemove', e => {
    if (!vDragSel[p]) return;
    vDragCurrent[p] = pointerToCanvas(e.clientX, e.clientY, cvs);
    vDraw(p);
  });
  cvs.addEventListener('mouseup', e => {
    if (!vDragSel[p] || !vDragStart[p]) return;
    const dx = e.clientX - vDragStart[p].x, dy = e.clientY - vDragStart[p].y;
    const sel = vDragSel[p];
    vDragSel[p] = null; vDragStart[p] = null; vDragCurrent[p] = null;
    vDraw(p);
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    dispatchVersusMove(p, sel, dir);
  });
  cvs.addEventListener('mouseleave', () => {
    vDragSel[p] = null; vDragStart[p] = null; vDragCurrent[p] = null; vDraw(p);
  });
}
attachVersusHandlers(1);
attachVersusHandlers(2);

function sendMove(r, c, dir) {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: 'move', row: r, col: c, dir }));
}

function dispatchMove(sel, dir) {
  const off = {right:[0,1], left:[0,-1], down:[1,0], up:[-1,0]}[dir];
  if (off) pendingMove = { rowA: sel.r, colA: sel.c, rowB: sel.r+off[0], colB: sel.c+off[1] };
  sendMove(sel.r, sel.c, dir);
}

function dispatchVersusMove(p, sel, dir) {
  const off = {right:[0,1], left:[0,-1], down:[1,0], up:[-1,0]}[dir];
  if (off) vPendingMove[p] = { rowA: sel.r, colA: sel.c, rowB: sel.r+off[0], colB: sel.c+off[1] };
  sendMove(sel.r, sel.c, dir);
}

function claimPlayer() {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: 'claim' }));
}

function claimVersus(p) {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: 'claim', player: p }));
}

function setMode(mode) {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: 'set_mode', mode }));
}

// ── Meta UI ────────────────────────────────────────────────────────────────
function updateMeta() {
  document.getElementById('score').textContent   = score;
  document.getElementById('cascade').textContent = cascade > 0 ? `×${cascade + 1}` : '—';
}

function setRole(r) {
  role = r;
  const badge = document.getElementById('role-badge');
  badge.textContent = r;
  badge.className   = r === 'observer' ? 'observer' : '';
  document.getElementById('claim-btn').style.display = r === 'observer' ? 'inline-block' : 'none';
}

function applyMode(m) {
  gameMode = m;
  const isVersus = m === 'versus';
  document.getElementById('solo-wrap').classList.toggle('show', !isVersus);
  document.getElementById('versus-wrap').classList.toggle('show', isVersus);
  document.getElementById('score-wrap').style.display   = isVersus ? 'none' : '';
  document.getElementById('cascade-wrap').style.display = isVersus ? 'none' : '';
  document.getElementById('btn-demo').classList.toggle('active', m === 'demo');
  document.getElementById('btn-attack').classList.toggle('active', m === 'attack');
  document.getElementById('btn-demo').style.display   = isVersus ? 'none' : '';
  document.getElementById('btn-attack').style.display = isVersus ? 'none' : '';
  document.getElementById('claim-btn').style.display  = isVersus ? 'none' : (role === 'observer' ? 'inline-block' : 'none');
}

function showGameOver(finalScore) {
  document.getElementById('go-score').textContent = `Score: ${finalScore}`;
  document.getElementById('gameover').classList.add('show');
}

function hideGameOver() {
  document.getElementById('gameover').classList.remove('show');
}

function vShowResult(p, isWinner, finalScore) {
  const overlay = document.getElementById(`vgameover${p}`);
  const title   = document.getElementById(`vgo-title${p}`);
  const scoreEl = document.getElementById(`vgo-score${p}`);
  title.textContent   = isWinner ? 'WINNER!' : 'DEFEATED';
  title.className     = isWinner ? 'win' : 'lose';
  scoreEl.textContent = `Score: ${finalScore}`;
  overlay.classList.add('show');
}

function vHideResult(p) {
  document.getElementById(`vgameover${p}`).classList.remove('show');
}

// ── WebSocket ─────────────────────────────────────────────────────────────
let ws;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    document.getElementById('conn').textContent = '● connected';
    document.getElementById('conn').className   = 'ok';
  };
  ws.onclose = () => {
    document.getElementById('conn').textContent = '● disconnected';
    document.getElementById('conn').className   = 'err';
    setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'welcome') {
      W = msg.width; H = msg.height;
      setSize();
      setRole(msg.role);
      if (msg.player_id) myPlayerID = msg.player_id;
      if (msg.mode) applyMode(msg.mode);
      updateVersusClaimButtons();
      return;
    }

    if (msg.type === 'role') {
      setRole(msg.role);
      if (msg.player_id) {
        myPlayerID = msg.player_id;
        updateVersusClaimButtons();
      }
      return;
    }

    const p = msg.player || 0; // 0 = solo

    if (msg.type === 'game_over') {
      if (msg.mode === 'versus') {
        const loser  = msg.player;
        const winner = msg.winner;
        vBoards[loser].status = 'gameover';
        vBoards[winner].status = 'gameover';
        vStopFlash(loser);
        vStopFlash(winner);
        vBoards[loser].swapAnim  = null; vBoards[loser].fallAnim  = null;
        vBoards[winner].swapAnim = null; vBoards[winner].fallAnim = null;
        vShowResult(winner, true,  vBoards[winner].score);
        vShowResult(loser,  false, vBoards[loser].score);
        return;
      }
      gameStatus = 'gameover';
      stopFlash();
      swapAnim = null; fallAnim = null;
      dragSel  = null; dragStart = null;
      score    = msg.score;
      updateMeta();
      draw();
      showGameOver(msg.score);
      return;
    }

    if (msg.type === 'swap_anim') {
      if (p > 0) {
        vHideResult(p);
        const pm = vPendingMove[p];
        vPendingMove[p] = null;
        const isOwn = pm &&
          pm.rowA === msg.rowA && pm.colA === msg.colA &&
          pm.rowB === msg.rowB && pm.colB === msg.colB;
        if (isOwn && msg.valid) return;
        vBoards[p].swapAnim = {
          rowA: msg.rowA, colA: msg.colA,
          rowB: msg.rowB, colB: msg.colB,
          colorA: msg.colorA, colorB: msg.colorB,
          valid: msg.valid,
          phase: isOwn ? 'reverse' : 'forward',
          startTime: performance.now(),
          duration: SWAP_MS,
        };
        vScheduleFrame(p);
        return;
      }
      hideGameOver();
      const pm = pendingMove;
      pendingMove = null;
      const isOwnDrag = pm &&
        pm.rowA === msg.rowA && pm.colA === msg.colA &&
        pm.rowB === msg.rowB && pm.colB === msg.colB;
      if (isOwnDrag && msg.valid) return;
      swapAnim = {
        rowA: msg.rowA, colA: msg.colA,
        rowB: msg.rowB, colB: msg.colB,
        colorA: msg.colorA, colorB: msg.colorB,
        valid: msg.valid,
        phase: isOwnDrag ? 'reverse' : 'forward',
        startTime: performance.now(),
        duration: SWAP_MS,
      };
      scheduleFrame();
      return;
    }

    if (msg.type === 'fall_anim') {
      if (p > 0) {
        vStopFlash(p);
        vBoards[p].matchSet = new Set();
        vBoards[p].status   = 'falling';
        if (msg.bricks) vBoards[p].bricks = msg.bricks;
        vBoards[p].fallAnim = {
          board: msg.board, score: msg.score, cascade: msg.cascade,
          balls: msg.balls.map(b => ({
            color: b.color, col: b.col,
            fromRow: b.fromRow, toRow: b.toRow, cur: b.fromRow, vel: 0,
          })),
        };
        vScheduleFrame(p);
        return;
      }
      stopFlash();
      matchSet   = new Set();
      gameStatus = 'falling';
      if (msg.bricks) bricks = msg.bricks;
      fallAnim = {
        board: msg.board, score: msg.score, cascade: msg.cascade,
        balls: msg.balls.map(b => ({
          color: b.color, col: b.col,
          fromRow: b.fromRow, toRow: b.toRow, cur: b.fromRow, vel: 0,
        })),
      };
      scheduleFrame();
      return;
    }

    if (msg.type === 'state') {
      if (p > 0) {
        const s = vBoards[p];
        if (msg.mode) applyMode(msg.mode);
        if (msg.status === 'waiting') vHideResult(p);
        if (msg.bricks) s.bricks = msg.bricks;
        if (msg.status === 'clearing') {
          s.board    = msg.board;
          s.score    = msg.score;
          s.matchSet = new Set((msg.matches || []).map(([r, c]) => `${r},${c}`));
          s.status   = 'clearing';
          document.getElementById(`vscore${p}`).textContent = s.score;
          vStartFlash(p);
          if (!s.swapAnim && !s.fallAnim) vDraw(p);
        } else {
          vStopFlash(p);
          s.matchSet = new Set();
          s.board    = msg.board;
          s.score    = msg.score;
          s.status   = msg.status;
          document.getElementById(`vscore${p}`).textContent = s.score;
          if (!s.swapAnim && !s.fallAnim) vDraw(p);
        }
        return;
      }
      if (msg.mode) applyMode(msg.mode);
      if (msg.status === 'waiting') hideGameOver();
      if (msg.bricks) bricks = msg.bricks;
      if (msg.status === 'clearing') {
        board    = msg.board;
        score    = msg.score;
        cascade  = msg.cascade || 0;
        matchSet = new Set((msg.matches || []).map(([r, c]) => `${r},${c}`));
        gameStatus = 'clearing';
        updateMeta();
        startFlash();
        if (!swapAnim && !fallAnim) draw();
      } else {
        stopFlash();
        matchSet  = new Set();
        board     = msg.board;
        score     = msg.score;
        cascade   = msg.cascade || 0;
        gameStatus = msg.status;
        updateMeta();
        document.getElementById('msg').textContent = msg.status === 'invalid' ? 'Invalid move — no match.' : '';
        if (!swapAnim && !fallAnim) draw();
      }
    }
  };
}

function updateVersusClaimButtons() {
  for (let p = 1; p <= 2; p++) {
    const btn = document.getElementById(`vclaim${p}`);
    btn.classList.toggle('hidden', myPlayerID === p);
  }
  const label1 = document.getElementById('board-label-1');
  const label2 = document.getElementById('board-label-2');
  if (myPlayerID === 1) { label1.textContent = 'You (P1)'; label2.textContent = 'Opponent (P2)'; }
  else if (myPlayerID === 2) { label1.textContent = 'Opponent (P1)'; label2.textContent = 'You (P2)'; }
  else { label1.textContent = 'Player 1'; label2.textContent = 'Player 2'; }
}

connect();
draw();
</script>
