<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>status-dashboard</title>
<style>
:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --border: #e2e1d9;
  --text: #1c1c1a;
  --muted: #6e6e69;
  --mono: "SFMono-Regular","Consolas","Liberation Mono",monospace;

  --c-green-bg: #eaf3de; --c-green: #3b6d11;
  --c-red-bg:   #fcebeb; --c-red:   #a32d2d;
  --c-amber-bg: #faeeda; --c-amber: #854f0b;
  --c-blue-bg:  #e6f1fb; --c-blue:  #185fa5;
  --c-gray-bg:  #f1efe8; --c-gray:  #5f5e5a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #181816; --surface: #222220; --border: #2e2e2b;
    --text: #e6e5de; --muted: #888780;
    --c-green-bg: #173404; --c-green: #c0dd97;
    --c-red-bg:   #501313; --c-red:   #f7c1c1;
    --c-amber-bg: #412402; --c-amber: #fac775;
    --c-blue-bg:  #042c53; --c-blue:  #b5d4f4;
    --c-gray-bg:  #2c2c2a; --c-gray:  #b4b2a9;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}

header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border)}
header svg{flex-shrink:0;opacity:.6}
header h1{font-size:15px;font-weight:500}
.updated{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.spin{width:11px;height:11px;border:1.5px solid var(--border);border-top-color:var(--c-blue);border-radius:50%;animation:spin .8s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* tabs */
.tabs{display:flex;gap:2px;padding:12px 20px 0;border-bottom:1px solid var(--border)}
.tab{padding:7px 16px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:6px 6px 0 0;border:1px solid transparent;border-bottom:none;margin-bottom:-1px;background:none}
.tab.active{color:var(--text);background:var(--surface);border-color:var(--border)}
.panel{display:none}
.panel.active{display:block}

main{padding:16px 20px}
.stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 14px;min-width:80px}
.stat-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat-v{font-size:22px;font-weight:500}

.err{background:var(--c-red-bg);color:var(--c-red);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;display:none}

/* table */
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
th{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg);padding:7px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;white-space:nowrap}
.g{background:var(--c-green-bg);color:var(--c-green)}
.r{background:var(--c-red-bg);color:var(--c-red)}
.a{background:var(--c-amber-bg);color:var(--c-amber)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dg{background:var(--c-green)}.dr{background:var(--c-red)}.da{background:var(--c-amber)}

.name{font-weight:500;font-size:14px}
.dim{color:var(--muted);font-size:12px}
.mono{font-family:var(--mono);font-size:12px}
.empty{text-align:center;padding:3rem;color:var(--muted)}

/* uptime bar */
.ubar{display:flex;gap:1px;align-items:center}
.ub{width:5px;height:18px;border-radius:1px;flex-shrink:0;cursor:default}
.ub-none{background:var(--border)}
.ub-up{background:var(--c-green)}
.ub-down{background:var(--c-red)}
</style>
</head>
<body>
<header>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
  </svg>
  <h1>status-dashboard</h1>
  <div class="updated">
    <div class="spin" id="spin"></div>
    <span id="ts">—</span>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tab-peers" onclick="switchTab('peers')">WireGuard peers</div>
  <div class="tab" id="tab-monitors" onclick="switchTab('monitors')">HTTP monitors</div>
  <div class="tab" id="tab-alerts" onclick="switchTab('alerts')">Alerts</div>
  <div class="tab" id="tab-events" onclick="switchTab('events')">Events</div>
</div>

<main>

  <!-- peers panel -->
  <div class="panel active" id="panel-peers">
    <div class="err" id="err-peers"></div>
    <div class="stats" id="stats-peers"></div>
    <div class="wrap">
      <table aria-label="WireGuard peer status">
        <thead>
          <tr>
            <th>Peer</th>
            <th>IP</th>
            <th>Endpoint</th>
            <th>Handshake</th>
            <th>Ping</th>
            <th>↓ RX</th>
            <th>↑ TX</th>
            <th>If</th>
          </tr>
        </thead>
        <tbody id="tbody-peers"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- monitors panel -->
  <div class="panel" id="panel-monitors">
    <div class="err" id="err-monitors"></div>
    <div class="stats" id="stats-monitors"></div>
    <div class="wrap">
      <table aria-label="HTTP endpoint status">
        <thead>
          <tr>
            <th>Endpoint</th>
            <th>URL</th>
            <th>Status</th>
            <th>Response</th>
            <th>Last 4h</th>
            <th>Checked</th>
          </tr>
        </thead>
        <tbody id="tbody-monitors"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- alerts panel -->
  <div class="panel" id="panel-alerts">
    <div class="wrap">
      <table aria-label="Alert history">
        <thead>
          <tr>
            <th>Time</th>
            <th>Monitor</th>
            <th>Event</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="tbody-alerts"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- events panel -->
  <div class="panel" id="panel-events">
    <div class="wrap">
      <table aria-label="ntfy events feed">
        <thead>
          <tr>
            <th>Time</th>
            <th>Title</th>
            <th>Message</th>
            <th>Tags</th>
          </tr>
        </thead>
        <tbody id="tbody-events"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

</main>

<script>
const INTERVAL = 12000;

function e(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

// ---------- peers ----------

function statusBadge(p){
  if(p.connected) return `<span class="badge g"><span class="dot dg"></span>connected</span>`;
  if(p.handshake_ts) return `<span class="badge a"><span class="dot da"></span>idle</span>`;
  return `<span class="badge r"><span class="dot dr"></span>no handshake</span>`;
}

function pingCell(p){
  if(p.ping_alive === null || p.ping_alive === undefined) return `<span class="dim">—</span>`;
  if(p.ping_alive){
    const rtt = p.ping_rtt_ms != null ? ` <span class="mono dim">${p.ping_rtt_ms} ms</span>` : '';
    return `<span class="badge g">alive</span>${rtt}`;
  }
  return `<span class="badge r">no reply</span>`;
}

function renderPeers(data){
  const errEl = document.getElementById('err-peers');
  if(data.error){ errEl.textContent = 'Error: '+data.error; errEl.style.display=''; }
  else errEl.style.display='none';

  const peers = data.peers || [];
  const conn = peers.filter(p=>p.connected).length;
  const reach = peers.filter(p=>p.ping_alive).length;

  document.getElementById('stats-peers').innerHTML = [
    ['peers', peers.length, ''],
    ['connected', conn, 'var(--c-green)'],
    ['reachable', reach, 'var(--c-blue)'],
    ['unreachable', peers.length-reach, peers.length-reach ? 'var(--c-red)' : ''],
  ].map(([l,v,c])=>`<div class="stat"><div class="stat-l">${l}</div><div class="stat-v"${c?` style="color:${c}"`:''}>${v}</div></div>`).join('');

  document.getElementById('tbody-peers').innerHTML = peers.length === 0
    ? `<tr><td colspan="8" class="empty">No peers found.</td></tr>`
    : peers.map(p=>`<tr>
        <td>
          ${p.name ? `<div class="name">${e(p.name)}</div>` : ''}
          <div class="mono dim">${e(p.pubkey_short)}</div>
          ${statusBadge(p)}
        </td>
        <td class="mono">${e(p.ip)||'<span class="dim">—</span>'}</td>
        <td class="mono dim">${e(p.endpoint)||'<span class="dim">—</span>'}</td>
        <td class="dim">${e(p.handshake)}</td>
        <td>${pingCell(p)}</td>
        <td class="mono dim">${e(p.rx)}</td>
        <td class="mono dim">${e(p.tx)}</td>
        <td class="mono dim">${e(p.iface)}</td>
      </tr>`).join('');
}

// ---------- monitors ----------

const HISTORY_SLOTS = 48; // 4h at 5-min intervals
let historyCache = {}; // name → []

function uptimeBar(name) {
  const history = historyCache[name] || [];
  // API returns newest-first; reverse so oldest is left
  const pts = [...history].reverse();
  const pad = Math.max(0, HISTORY_SLOTS - pts.length);
  const blocks = [
    ...Array(pad).fill(null),
    ...pts,
  ].map(p => {
    if (!p) return `<span class="ub ub-none" title="no data"></span>`;
    const t = new Date(p.checked_at * 1000).toLocaleTimeString();
    const tip = p.up
      ? `${t}: ${p.status_code} (${p.response_ms}ms)`
      : `${t}: down${p.error ? ' — ' + p.error : ''}`;
    return `<span class="ub ${p.up ? 'ub-up' : 'ub-down'}" title="${e(tip)}"></span>`;
  }).join('');
  return `<div class="ubar">${blocks}</div>`;
}

async function fetchHistory(monitors) {
  const results = await Promise.all(
    monitors.map(m =>
      fetch(`/monitors-history?monitor=${encodeURIComponent(m.name)}&limit=${HISTORY_SLOTS}`)
        .then(r => r.ok ? r.json() : [])
        .catch(() => [])
    )
  );
  monitors.forEach((m, i) => { historyCache[m.name] = results[i] || []; });
}

function renderMonitors(data) {
  const errEl = document.getElementById('err-monitors');
  errEl.style.display = 'none';

  const monitors = data || [];
  const up = monitors.filter(m=>m.up).length;
  const down = monitors.length - up;

  document.getElementById('stats-monitors').innerHTML = [
    ['total', monitors.length, ''],
    ['up', up, up === monitors.length ? 'var(--c-green)' : ''],
    ['down', down, down ? 'var(--c-red)' : ''],
  ].map(([l,v,c])=>`<div class="stat"><div class="stat-l">${l}</div><div class="stat-v"${c?` style="color:${c}"`:''}>${v}</div></div>`).join('');

  document.getElementById('tbody-monitors').innerHTML = monitors.length === 0
    ? `<tr><td colspan="6" class="empty">No monitors configured.</td></tr>`
    : monitors.map(m => {
        const badge = m.up
          ? `<span class="badge g"><span class="dot dg"></span>${e(m.status_code)}</span>`
          : `<span class="badge r"><span class="dot dr"></span>${m.status_code ? e(m.status_code) : 'error'}</span>`;
        const rtt = m.response_ms ? `<span class="mono dim">${m.response_ms} ms</span>` : '<span class="dim">—</span>';
        const age = m.checked_at ? fmtAge(m.checked_at) : '—';
        const errTip = m.error ? ` title="${e(m.error)}"` : '';
        return `<tr${errTip}>
          <td><div class="name">${e(m.name)}</div>${m.error ? `<div class="mono dim" style="color:var(--c-red)">${e(m.error.slice(0,80))}</div>` : ''}</td>
          <td class="mono dim"><a href="${e(m.url)}" target="_blank" rel="noopener" style="color:inherit">${e(m.url)}</a></td>
          <td>${badge}</td>
          <td>${rtt}</td>
          <td>${uptimeBar(m.name)}</td>
          <td class="dim">${age}</td>
        </tr>`;
      }).join('');
}

function fmtAge(ts){
  const age = Math.floor(Date.now()/1000) - ts;
  if(age < 60) return `${age}s ago`;
  if(age < 3600) return `${Math.floor(age/60)}m ago`;
  return `${Math.floor(age/3600)}h ago`;
}

// ---------- alerts ----------

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
}

function renderAlerts(data) {
  const recs = data || [];
  document.getElementById('tbody-alerts').innerHTML = recs.length === 0
    ? `<tr><td colspan="4" class="empty">No alerts recorded.</td></tr>`
    : recs.map(r => {
        const evtBadge = r.event === 'down'
          ? `<span class="badge r">down</span>`
          : `<span class="badge g">recovery</span>`;
        return `<tr>
          <td class="mono dim" style="white-space:nowrap">${e(fmtTime(r.sent_at))}</td>
          <td><span class="name">${e(r.monitor)}</span></td>
          <td>${evtBadge}</td>
          <td class="dim">${e(r.message)}</td>
        </tr>`;
      }).join('');
}

// ---------- events ----------

function priorityBadge(p) {
  if (p >= 5) return `<span class="badge r">urgent</span> `;
  if (p >= 4) return `<span class="badge a">high</span> `;
  return '';
}

function renderEvents(data) {
  const msgs = data || [];
  document.getElementById('tbody-events').innerHTML = msgs.length === 0
    ? `<tr><td colspan="4" class="empty">No events in the last 7 days.</td></tr>`
    : msgs.map(m => {
        const tags = (m.tags || []).map(t => `<span class="badge" style="background:var(--c-gray-bg);color:var(--c-gray)">${e(t)}</span>`).join(' ');
        return `<tr>
          <td class="mono dim" style="white-space:nowrap">${e(fmtTime(m.time))}</td>
          <td>${priorityBadge(m.priority)}<span class="name">${e(m.title || '—')}</span></td>
          <td class="dim">${e(m.message)}</td>
          <td>${tags || '<span class="dim">—</span>'}</td>
        </tr>`;
      }).join('');
}

// ---------- refresh ----------

async function refresh(){
  const spin = document.getElementById('spin');
  spin.style.display = '';
  try {
    const [peersResp, monsResp, alertsResp, eventsResp] = await Promise.allSettled([
      fetch('/status'),
      fetch('/monitors-status'),
      fetch('/notifications?limit=100'),
      fetch('/ntfy-events'),
    ]);

    if(peersResp.status === 'fulfilled' && peersResp.value.ok)
      renderPeers(await peersResp.value.json());
    else
      document.getElementById('err-peers').textContent = 'Could not reach /status';

    if(monsResp.status === 'fulfilled' && monsResp.value.ok) {
      const monitors = await monsResp.value.json();
      await fetchHistory(monitors);
      renderMonitors(monitors);
    } else {
      document.getElementById('err-monitors').style.display = '';
      document.getElementById('err-monitors').textContent = 'Could not reach /monitors-status';
    }

    if(alertsResp.status === 'fulfilled' && alertsResp.value.ok)
      renderAlerts(await alertsResp.value.json());

    if(eventsResp.status === 'fulfilled' && eventsResp.value.ok)
      renderEvents(await eventsResp.value.json());

    document.getElementById('ts').textContent = 'updated ' + new Date().toLocaleTimeString();
  } finally { spin.style.display = 'none'; }
}

refresh();
setInterval(refresh, INTERVAL);
</script>
</body>
</html>
